    status: UNSUPPORTED
    note: "Test-only exporter fixture; excluded from release coverage."
  - name: toy-assert-evaluator-faithfulness
    status: COVERED
    note: "One synthetic cross-interaction AIR is compared row-for-row with Stwo AssertEvaluator over an honest nonconstant trace and every single-cell mutation. A standard LookupElements fixture compares uncompressed entries with RelationTrackerEvaluator, accepts a Stwo-generated LogUp trace in both evaluators, and rejects every exported relation cell mutation. Relation compression requires an explicit StwoLookupElements contract and an implementation fingerprint bound to concrete z and alpha references; custom relation protocols, transcript derivation of those references, and arbitrary FrameworkEval components remain unsupported."
