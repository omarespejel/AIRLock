    note: "The alpha-in-M31 path is quarantined; no executable repair is covered."
  - name: stwo-verifier-boundary
    status: UNSUPPORTED
    note: "Broad Stwo and production-integration coverage is not yet instantiated."
  - name: stwo-demo-verifier-boundary
    status: COVERED
    note: "Pinned real proof; verifier-derived OODS sample request; typed mutations of sampled values, commitments, decommitment hash witnesses, queried values, and the PoW nonce; raw-PCS/framework differential replay; bounded source-pinned JSON replay with Unix atomic no-follow opening and fail-closed behavior elsewhere. Queried-values truncation records a non-green panic in both layers. Other decommitment fields, FRI internals, query positions, configuration, components, and production integrations are not covered."
  - name: stwo-demo-replay-artifact
    status: COVERED
    note: "Verifier-boundary sub-surface only: pinned request; private copied worker; bounded subprocess; deterministic three-file replay bundle; strict inventory, checksum, schema, source/target, and replay validation; fail-closed CLI and generated Rust regression. Not evidence/provenance assurance, an OS sandbox, or producer authentication."
  - name: stwo-demo-witness-consistency
    status: COVERED
    note: "Scoped to the pinned transition demo's sole Phase1Original M31 column: the same pre-commitment values are evaluated by AuditIR and committed by Stwo; the honest trace and an all-row Increment mutation produce proofs accepted by the full verifier; one single-cell Increment mutation at each of the 16 physical rows is rejected by the prover. Other scalar operators, columns, and public, interaction, or reduction phases remain unsupported. This is not semantic, statement, transcript, FRI, or whole-system assurance."
  - name: stwo-held-out-wide-fibonacci-witness
    status: COVERED
    note: "Exactly one upstream validation target, WideFibonacciEval<3> at log size 4: the verifier request and three original M31 columns are derived from the real component; the honest witness and a coordinated same-row Increment mutation at every physical row satisfy AuditIR, prove, and verify; incrementing only the third column at every physical row violates AuditIR and is rejected by the Stwo prover. Unsupported phases, columns, rows, scalar operators, broad stwo-examples behavior, and all other components fail closed or remain unsupported. This is adapter-generality evidence, not broad Stwo, transcript, FRI, semantic, or application soundness."
  - name: stwo-cross-target-original-m31-matrix
    status: COVERED
    note: "Exact transition-demo and WideFibonacciEval<3> targets only: one Increment and one Decrement mutation for every declared Phase1Original M31 cell, for 128 deterministic cases. Concrete AuditIR evaluation classifies each case; the same mutated values enter real Stwo proof generation; 16 relation-preserving cases pass the full verifier and 112 relation violations receive a typed constraint rejection; static validation reconstructs the exact inventory and fresh verification requires artifact equality. Other operators, phases, targets, solver search, broad malicious-witness coverage, and cryptographic soundness remain unsupported."
  - name: stwo-demo-campaign-artifact
    status: COVERED
    note: "Fixed transition-demo plus one independently selected WideFibonacciEval<3> validation target: complete typed witness records, deterministic source-bound manifest and summary, exact replay-worker digest, strict recursive inventory, bounded UTF-8 files, nested and top-level checksums, exact case verdicts and mutation plans, coverage snapshot, portable-content validation, generated-regression reconstruction, and fresh boundary, witness, and held-out replay. The bundle is unsigned and does not establish authorship, trusted time, broad Stwo coverage, or cryptographic soundness."
  - name: broad-evidence-provenance
    status: UNSUPPORTED
    note: "No signed publication, trusted timestamp, production component inventory, or cross-machine attestation."
  - name: stwo-transcript
    status: COVERED
    note: "Scoped to one observed projection of the pinned verifier's query-phase transcript: the nonce read, the proof-of-work verification over it, the nonce absorption, and the FRI query-position draw. Events are reported by the checked transcript patch and never reconstructed from the proof or config. An exact contract over that projection is satisfied by a conventional pow_bits=10 profile and by a zero-work profile carrying the canonical zero nonce; at zero work with a prover-chosen nonzero nonce the unmodified verifier accepts while the oracle returns a Counterexample. Sampled-value absorption, the quotient coefficient draw, FRI folding challenges, statement and commitment absorption, and domain separation are outside the projection and remain unmodeled; the sampled-value exclusion is a recorded judgement call, not an oversight, since that absorption precedes its shape reconciliation but yields no attacker advantage we have identified and its panic consequence is already observed in the verifier-boundary lane. Four-lane scope: the AIR lane is untouched, since no constraint or AuditIR claim follows from a transcript observation; the statement lane stays OUT_OF_MODEL; the protocol lane gains only the declared query-phase ordering and proof-of-work binding over this projection, not whole-transcript, Fiat-Shamir, or FRI security; the evidence lane gains one observed trace per case, content addressed and unsigned, establishing no authorship or trusted time. This is transcript-ordering evidence over a named projection, not cryptographic soundness assurance."
  - name: warp-streaming
    status: UNSUPPORTED
    note: "No executable component adapter is available for this surface."
