[workspace]
resolver = "2"
members = [
    "crates/airlock-ir",
    "crates/airlock-lint",
    "crates/airlock-cli",
]
default-members = [
    "crates/airlock-ir",
    "crates/airlock-lint",
    "crates/airlock-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/omarespejel/AIRLock"
rust-version = "1.94"

[workspace.dependencies]
airlock-ir = { path = "crates/airlock-ir" }
airlock-lint = { path = "crates/airlock-lint" }
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
indexmap = { version = "2.7", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
