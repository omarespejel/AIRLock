[workspace]
resolver = "2"
members = [
    "crates/airlock-boundary",
    "crates/airlock-ir",
    "crates/airlock-lint",
    "crates/airlock-cli",
    "crates/airlock-export",
    "crates/airlock-stwo",
]
default-members = [
    "crates/airlock-boundary",
    "crates/airlock-ir",
    "crates/airlock-lint",
    "crates/airlock-cli",
]
# `airlock-export` stays a workspace member but is not a default member: it
# requires a sibling Stwo checkout at `../stwo` (see docs/STWO_PATCH.md).
# `airlock-stwo` has the same pinned source requirement.
# Build/test either explicitly with `cargo test -p <crate> --locked`.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/omarespejel/AIRLock"
rust-version = "1.94"

[workspace.dependencies]
airlock-ir = { path = "crates/airlock-ir" }
airlock-lint = { path = "crates/airlock-lint" }
airlock-export = { path = "crates/airlock-export" }
airlock-boundary = { path = "crates/airlock-boundary" }
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
indexmap = { version = "2.7", features = ["serde"] }
libc = "0.2"
nix = { version = "0.30", default-features = false, features = ["process", "signal"] }
num-traits = "0.2"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
# Sibling Stwo checkout verified against the documented upstream source baseline.
stwo = { path = "../stwo/crates/stwo", version = "2.2.0", default-features = false, features = ["std", "prover"] }
stwo-constraint-framework = { path = "../stwo/crates/constraint-framework", version = "2.2.0", features = ["std", "prover"] }
stwo-examples = { path = "../stwo/crates/examples", version = "2.2.0" }

[profile.release]
lto = "thin"
codegen-units = 1
