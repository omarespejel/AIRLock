name: Non-security bug
description: Report a reproducible AIRLock false positive, crash, or tooling bug.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for a suspected vulnerability or false green. Use the private security link instead.
  - type: input
    id: commit
    attributes:
      label: AIRLock commit
      description: Paste the full commit hash you tested.
      placeholder: 40-character Git commit
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: State what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest public fixture and exact commands.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: Assurance lane
      options:
        - AIR relation
        - Statement binding
        - Protocol, transcript, FRI, or Fiat-Shamir
        - Evidence or provenance
        - Repository tooling
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report contains no private vulnerability details, secrets, customer data, or production exploit material.
          required: true
